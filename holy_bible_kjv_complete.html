async function loadKJVBook(name){
  if(loadedBooks.has(name)) return true;

    const chapters=data.chapters;
    const entries=Array.isArray(chapters)?chapters:Object.keys(chapters||{}).sort((a,b)=>+a-(+b)).map(k=>chapters[k]);
    entries.forEach((chapter,ci)=>{
      const verses=chapter.verses||{};
      const out={};
      if(Array.isArray(verses)) verses.forEach((v,vi)=>{if(v&&v.text)out[+(v.number||v.verse||vi+1)]=v.text;});

      T[name+" "+(ci+1)]=out;
    });
    loadedBooks.add(name);
    return true;
  }catch(err){
    toast("Could not load the complete KJV text. Check your internet connection.");
    return false;
  }finally{loadingBooks.delete(name);}
}

{id:'g',n:'Thirty days of spiritual growth',days:L('Psalms 1|Proverbs 2|Proverbs 3|Isaiah 40|Matthew 5|Matthew 6|Matthew 7|John 15|Romans 8|Romans 12|1 Corinthians 13|2 Corinthians 5|Galatians 5|Ephesians 4|Ephesians 6|Philippians 2|Philippians 3|Colossians 3|1 Thessalonians 5|2 Timothy 3|Hebrews 12|James 1|James 3|1 Peter 1|2 Peter 1|1 John 3|1 John 4|Psalms 91|Psalms 103|Joshua 1')}];

function results(){const r=find(q);let h=r.map(x=>`<button class="card" style="width:100%;text-align:left;color:var(--tx)" data-a="open" data-b="${x.b}" data-c="${x.c}" data-v="${x.v}"><b>${x.b} ${x.c}${x.v?':'+x.v:''}</b><div class="serif">${esc(x.t||'(text not in sample dataset)')}</div></button>`).join('');
const lq=q.trim().toLowerCase();if(lq){for(const k in S.bm)if(k.toLowerCase().includes(lq))h+=`<div class="card"><span class="tag">Bookmark</span> ${esc(k)}</div>`;for(const k in S.nt)if(S.nt[k].toLowerCase().includes(lq)||k.toLowerCase().includes(lq))h+=`<div class="card"><span class="tag">Note</span> <b>${esc(k)}</b><br>${esc(S.nt[k])}</div>`}
return h||(q.trim()?'<p class="mu">No matches in the sample dataset. Try “John 3:16”, “love” or “Psalms 23”.</p>':'<p class="mu">Search verses (John 3:16), keywords, books, and your notes.</p>')}
function disc(){if(dv=='menu')return`<h1>Discover</h1><label for="q">Search</label><input id="q" type="search" placeholder="John 3:16, faith, Psalms…" value="${esc(q)}" autocomplete="off"><div id="rs">${results()}</div><h2>Explore</h2><button class="card" style="width:100%;text-align:left;color:var(--tx)" data-a="dv" data-t="plans"><b>Reading plans</b><div class="mu">6 plans with progress tracking</div></button><button class="card" style="width:100%;text-align:left;color:var(--tx)" data-a="dv" data-t="quiz"><b>Bible quiz</b><div class="mu">Multiple choice, with references</div></button>`;
if(dv=='plans')return`<button class="sm" data-a="dv" data-t="menu">‹ Back</button><h1 style="margin:12px 0">Reading plans</h1>${PL.map(p=>{const s=S.pl[p.id],dn=s?Object.keys(s.d).length:0;return`<button class="card" style="width:100%;text-align:left;color:var(--tx)" data-a="plan" data-id="${p.id}"><b>${p.n}</b><div class="mu">${s?s.st+' · ':''}${dn}/${p.days.length} days</div><div class="pb"><i style="width:${dn/p.days.length*100}%"></i></div></button>`}).join('')}`;
if(dv=='plan'){const p=PL.find(x=>x.id==pid),s=S.pl[pid],dn=s?Object.keys(s.d).length:0;
return`<button class="sm" data-a="dv" data-t="plans">‹ Plans</button><h1 style="margin:12px 0">${p.n}</h1><div class="pb"><i style="width:${dn/p.days.length*100}%"></i></div><p class="mu">${dn} of ${p.days.length} days done ${s?'· '+s.st:''}</p><div class="row">${!s?'<button class="p" data-a="ps" data-s="active">Start plan</button>':s.st=='active'?'<button data-a="ps" data-s="paused">Pause</button>':s.st=='paused'?'<button class="p" data-a="ps" data-s="active">Resume</button>':''}${s&&s.st!='done'?'<button data-a="ps" data-s="done">Mark complete</button>':''}</div><div class="note">Reminders need notifications, which aren't connected yet (see Profile → Setup).</div>
${p.days.slice(0,s?undefined:30).map((g,i)=>`<div class="day"><button class="sm ${s&&s.d[i+1]?'p':''}" aria-label="Day ${i+1} ${s&&s.d[i+1]?'done':'not done'}" data-a="pd" data-n="${i+1}" ${s&&s.st!='done'?'':'disabled'}>${s&&s.d[i+1]?'✓':i+1}</button><div><span class="mu">Day ${i+1}</span><br><a href="#" style="color:var(--gd)" data-a="open" data-b="${B[g[0][0]][0]}" data-c="${g[0][1]}">${fmt(g)}</a></div></div>`).join('')}${!s&&p.days.length>30?`<p class="mu">Start the plan to see all ${p.days.length} days.</p>`:''}`}
if(dv=='quiz'){if(qi>=Q.length)return`<h1>Quiz complete</h1><div class="card"><p class="serif" style="font-size:28px">${qs} / ${Q.length}</p><p class="mu">Best: ${S.qz.best||0}</p><button class="p" data-a="qr">Play again</button> <button data-a="dv" data-t="menu">Back</button></div>`;
const x=Q[qi];return`<button class="sm" data-a="dv" data-t="menu">‹ Back</button><p class="mu">Question ${qi+1} of ${Q.length} · ${x[0]}</p><h2 style="margin-top:4px">${x[1]}</h2>${x[2].map((o,i)=>`<button class="card" style="width:100%;text-align:left;color:var(--tx);${qa!==null&&i==x[3]?'border-color:#2f8f4f;border-width:2px':qa==i?'border-color:#b3261e;border-width:2px':''}" data-a="qa" data-i="${i}" ${qa!==null?'disabled':''}>${o}</button>`).join('')}${qa!==null?`<div class="note">${qa==x[3]?'Correct.':'Not quite.'} Reference: <b>${x[4]}</b></div><button class="p" data-a="qn">${qi==Q.length-1?'See score':'Next question'}</button>`:''}`}}
function pray(){const list=S.pr.filter(p=>(pf=='All'||p.st==pf)&&(!pq||(p.t+p.x+p.r).toLowerCase().includes(pq.toLowerCase())));const e=pe!==null?S.pr.find(p=>p.id==pe):null;
return`<h1>Prayer journal</h1><p class="mu">Stored only on this device.</p><form class="card" id="pf" novalidate><label for="pt">Title</label><input id="pt" maxlength="80" value="${e?esc(e.t):''}"><label for="pc">Category</label><select id="pc">${['Personal','Family','Health','Thanksgiving','Guidance','Others'].map(c=>`<option ${e&&e.c==c?'selected':''}>${c}</option>`).join('')}</select><label for="px">Prayer request</label><textarea id="px" rows="3" maxlength="1000">${e?esc(e.x):''}</textarea><label for="pr">Reflection (optional)</label><textarea id="pr" rows="2" maxlength="1000">${e?esc(e.r):''}</textarea><div class="row"><button class="p" type="submit">${e?'Save changes':'Add prayer'}</button>${e?'<button type="button" data-a="pcx">Cancel</button>':''}</div></form>
<div class="row seg">${['All','Ongoing','Answered'].map(f=>`<button class="sm" data-a="pf" data-f="${f}" aria-pressed="${pf==f}">${f}</button>`).join('')}</div><input id="ps" type="search" placeholder="Search prayers" value="${esc(pq)}" aria-label="Search prayers"><div id="pl">${plist(list)}</div>`}
function plist(l){return l.length?l.map(p=>`<div class="card"><div class="row sp"><b>${esc(p.t)}</b><span class="tag">${p.st}</span></div><div class="mu">${esc(p.c)} · ${new Date(p.d).toLocaleDateString()}</div><p>${esc(p.x)}</p>${p.r?`<p class="mu"><i>Reflection:</i> ${esc(p.r)}</p>`:''}<div class="row"><button class="sm" data-a="pk" data-id="${p.id}">${p.st=='Answered'?'Mark ongoing':'Mark answered'}</button><button class="sm" data-a="pedit" data-id="${p.id}">Edit</button><button class="sm" data-a="pdel" data-id="${p.id}">Delete</button></div></div>`).join(''):'<div class="card mu">No prayers here yet. Write your first request above.</div>'}
function prof(){const bms=Object.keys(S.bm),nts=Object.keys(S.nt);
const setup=[['Accounts & cross-device sync','Needs a backend (e.g. Supabase Auth + Postgres with row-level security). Data currently lives only in this browser.'],['Complete Bible text (KJV)','The app loads the complete public-domain KJV by book from an online JSON dataset. An internet connection is needed when loading a book for the first time; this build does not yet bundle the entire text for offline use. Other translations may require a license.'],['Audio Bible','Needs a licensed audio provider or files.'],['Notifications & reminders','Needs a service worker, push service and permission flow.'],['Community','Needs a backend with moderation, reporting and blocking.'],['Admin dashboard','Needs server-side role-based access control. It must not be built in frontend code alone.'],['Offline / installable app','Needs a hosted manifest and service worker.']];
return`<h1>Profile</h1><p class="mu">Guest mode · no account</p><h2>Reading settings</h2><div class="card"><label for="fs">Text size: ${S.fs}px</label><input id="fs" type="range" min="15" max="32" value="${S.fs}"><label for="lh">Line spacing: ${S.lh}</label><input id="lh" type="range" min="1.3" max="2.2" step="0.1" value="${S.lh}"><label for="dk">Theme</label><select id="dk"><option value="n" ${S.dark===null?'selected':''}>Match device</option><option value="l" ${S.dark===false?'selected':''}>Light</option><option value="d" ${S.dark===true?'selected':''}>Dark</option></select></div>
<h2>Saved verses (${bms.length})</h2>${bms.length?bms.map(k=>{const m=k.match(/^(.+) (\d+):(\d+)$/);return`<div class="card row sp"><span><b>${esc(k)}</b><br><span class="serif">${esc(vtxt(m[1],m[2],m[3]))}</span></span><span class="row"><button class="sm" data-a="open" data-b="${m[1]}" data-c="${m[2]}" data-v="${m[3]}">Open</button><button class="sm" data-a="bm" data-k="${esc(k)}">Remove</button></span></div>`}).join(''):'<div class="card mu">No bookmarks yet. Select a verse in the reader.</div>'}
<h2>Notes (${nts.length})</h2>${nts.length?nts.map(k=>{const m=k.match(/^(.+) (\d+):(\d+)$/);return`<div class="card"><b>${esc(k)}</b><p>${esc(S.nt[k])}</p><div class="row"><button class="sm" data-a="open" data-b="${m[1]}" data-c="${m[2]}" data-v="${m[3]}">Open</button><button class="sm" data-a="ned" data-k="${esc(k)}">Edit</button><button class="sm" data-a="ndel" data-k="${esc(k)}">Delete</button></div></div>`}).join(''):'<div class="card mu">No notes yet.</div>'}
<h2>Your data</h2><div class="row"><button data-a="exp">Copy backup (JSON)</button><button data-a="rst">Erase all data</button></div>
<h2>Setup needed</h2><p class="mu">These features need external services. They are not faked here.</p>${setup.map(s=>`<div class="note"><b>${s[0]}</b><br>${s[1]}</div>`).join('')}`}
function render(){$('#nv').innerHTML=NAV.map(n=>`<button data-a="tab" data-t="${n[0]}" ${tab==n[0]?'aria-current="page"':''}><b>${n[1]}</b>${n[2]}</button>`).join('');
if(tab!='bible')rd=tab=='bible'?rd:rd;$('#m').innerHTML={home,bible,disc,pray,prof}[tab]()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;if(a=='open')e.preventDefault();
const A={tab:()=>{if(d.t=='bible')rd=null;go(d.t)},open:()=>open(d.b,+d.c,+d.v||0),dd:()=>{dd+=+d.n;render()},bk:()=>{rd=null;bk=+d.i;tab='bible';render()},bkx:()=>{bk=null;render()},rx:()=>{rd=null;render()},ts:()=>{ts=d.t;render()},
bm:()=>{const k=d.k;S.bm[k]?delete S.bm[k]:S.bm[k]=1;save();render()},shr:()=>share('“'+vtxt(d.b,d.c,d.v)+'” — '+cite(d.b,d.c,d.v)),
sv:()=>{const v=+d.v;sel.has(v)?sel.delete(v):sel.add(v);render();const el=document.getElementById('v'+v);el&&el.focus({preventScroll:true})},
hl:()=>{sel.forEach(v=>{const k=key(rd.b,rd.c,v);+d.h?S.hl[k]=+d.h:delete S.hl[k]});save();sel.clear();render()},
bms:()=>{sel.forEach(v=>S.bm[key(rd.b,rd.c,v)]=1);save();toast('Bookmarked');sel.clear();render()},
nt:()=>{const v=[...sel][0],k=key(rd.b,rd.c,v),x=prompt('Note for '+k,S.nt[k]||'');if(x!==null){x.trim()?S.nt[k]=x.trim().slice(0,1000):delete S.nt[k];save();toast('Note saved')}},
ned:()=>{const x=prompt('Edit note for '+d.k,S.nt[d.k]);if(x!==null){x.trim()?S.nt[d.k]=x.trim().slice(0,1000):delete S.nt[d.k];save();render()}},ndel:()=>{if(confirm('Delete this note?')){delete S.nt[d.k];save();render()}},
cps:()=>cp(selTxt()),shs:()=>share(selTxt()),dv:()=>{dv=d.t;render()},plan:()=>{pid=d.id;dv='plan';render()},
ps:()=>{const s=S.pl[pid]||(S.pl[pid]={st:'active',d:{}});s.st=d.s;save();render()},pd:()=>{const s=S.pl[pid];s.d[d.n]?delete s.d[d.n]:s.d[d.n]=1;save();render()},
qa:()=>{qa=+d.i;if(qa==Q[qi][3])qs++;render()},qn:()=>{qi++;qa=null;if(qi>=Q.length){S.qz.best=Math.max(S.qz.best||0,qs);save()}render()},qr:()=>{qi=0;qs=0;qa=null;render()},
pf:()=>{pf=d.f;render()},pk:()=>{const p=S.pr.find(x=>x.id==d.id);p.st=p.st=='Answered'?'Ongoing':'Answered';save();render()},pedit:()=>{pe=+d.id;render();scrollTo(0,0)},pcx:()=>{pe=null;render()},pdel:()=>{if(confirm('Delete this prayer?')){S.pr=S.pr.filter(x=>x.id!=d.id);save();render()}},
exp:()=>cp(JSON.stringify(S)),rst:()=>{if(confirm('Erase everything saved on this device?')){localStorage.removeItem('hb1');location.reload()}}};
A[a]&&A[a]()});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.dataset&&e.target.dataset.a=='sv'){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const i=e.target.id;

else if(i=='fs'){S.fs=+e.target.value;theme();save();e.target.previousElementSibling.textContent='Text size: '+S.fs+'px'}
else if(i=='lh'){S.lh=+e.target.value;theme();save();e.target.previousElementSibling.textContent='Line spacing: '+S.lh}});

const o={t,x,c:$('#pc').value,r:$('#pr').value.trim()};
if(pe!==null){Object.assign(S.pr.find(p=>p.id==pe),o);pe=null;toast('Prayer updated')}else{S.pr.unshift({id:Date.now(),d:Date.now(),st:'Ongoing',...o});toast('Prayer added')}
save();render()});
theme();render();setTimeout(()=>$('#sp').classList.add('off'),1500);setTimeout(()=>$('#sp').remove(),2300);
